name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a red build can be re-run without an empty commit.
  workflow_dispatch:

# A newer push makes an in-flight run irrelevant. Don't burn minutes on it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Each check is its own step so a red build says which promise broke,
      # rather than just "the script failed".
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Invariants
        run: pnpm check:invariants

      - name: Build
        run: pnpm build
